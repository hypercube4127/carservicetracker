# build-and-deploy-all.yml

name: Build and Push Docker Image

on:
  push:
    branches:
      - develop

jobs:
  build-backend:
    uses: ./.github/workflows/build-backend.yml
    with:
      BUILD_DIR: backend
      IMAGE_NAME: carservicetracker
      TAG: be-latest-develop
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    runs-on: [self-hosted]
    needs: build
    environment: staging
    steps:
      - name: Deploy Docker Compose
        run: |
          cd ${{ vars.DEPLOY_DIR }}
          docker-compose pull
          docker-compose up -d
