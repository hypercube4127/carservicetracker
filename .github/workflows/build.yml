name: Docker Build

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        required: true
        type: string
      TAG:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: cd ./${{inputs.IMAGE_NAME}} && docker build --target prod -t ${{ vars.REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ inputs.TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ vars.REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ inputs.TAG }}