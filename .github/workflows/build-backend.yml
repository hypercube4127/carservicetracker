# build-backend.yml

name: Docker Build

on:
  workflow_call:
    inputs:
      BUILD_DIR:
        required: true
        type: string
      IMAGE_NAME:
        required: true
        type: string
      TAG:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Build Number and Commit ID into pyproject.toml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_ID=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i "s/build = \".*\"/build = \"$BUILD_NUMBER\"/" ./${{ inputs.BUILD_DIR }}/pyproject.toml
          sed -i "s/commit = \".*\"/commit = \"$COMMIT_ID\"/" ./${{ inputs.BUILD_DIR }}/pyproject.toml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.BUILD_DIR }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.REGISTRY }}/${{ inputs.IMAGE_NAME }}:${{ inputs.TAG }}
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

