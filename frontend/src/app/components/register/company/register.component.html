<div class="login-wrapper">
  <mat-card class="login">
    <mat-card-title>Register company</mat-card-title>
    <img src="/assets/images/register.png" alt="register">
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <mat-form-field appearance="fill">
          <mat-label>Your name</mat-label>
          <input matInput formControlName="name" name="name" required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Company name</mat-label>
          <input matInput formControlName="companyName" name="companyName" required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" name="email" required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" name="password" type="password" required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Confirm password</mat-label>
          <input matInput formControlName="reTypePassword" name="reTypePassword" type="password" required>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">Register</button>
        <button mat-button color="warn" class="back" type="button" (click)="goLogin()">Back</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
