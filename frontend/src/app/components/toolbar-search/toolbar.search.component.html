<mat-form-field class="no-subscript custom-input">
    <input matInput [placeholder]="'Search'" (input)="onSearch($event)" [matAutocomplete]="hits">
</mat-form-field>

<mat-autocomplete #hits="matAutocomplete">
    <mat-optgroup [label]="'Cars'">
        @for (option of carHits; track carHits) {
            <mat-option [value]="option">{{option.plate}} ({{option.vin}})</mat-option>
        }
    </mat-optgroup>
</mat-autocomplete>
